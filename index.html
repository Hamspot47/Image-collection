<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image creation using lightbox2</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/lightbox.min.css" />
  </head>
  <body>
    <h1>Fruit <span>Gallery</span></h1>
    <div class="container">
      <div class="gallery">
        <a href="img/image 1.jpg" data-lightbox="fruits" data-title="Avocado"
          ><img src="img/image 1.jpg"
        /></a>
        <a href="img/image 2.jpg" data-lightbox="fruits" data-title="Red Apple"
          ><img src="img/image 2.jpg"
        /></a>
        <a href="img/image 3.jpg" data-lightbox="fruits" data-title="Strawberry"
          ><img src="img/image 3.jpg"
        /></a>
        <a href="img/image 4.jpg" data-lightbox="fruits" data-title="Banana"
          ><img src="img/image 4.jpg"
        /></a>
        <a href="img/image 5.jpg" data-lightbox="fruits" data-title="Strawberry2"
          ><img src="img/image 5.jpg"
        /></a>
        <a href="img/image 6.jpg" data-lightbox="fruits" data-title="Orange"
          ><img src="img/image 6.jpg"
        /></a>
        <a href="img/image 7.jpg" data-lightbox="fruits" data-title="Pineapple"
          ><img src="img/image 7.jpg"
        /></a>
        <a href="img/image 8.jpg" data-lightbox="fruits" data-title="Apple"
          ><img src="img/image 8.jpg"
        /></a>
      </div>
    </div>
    <script src="lightbox-plus-jquery.min.js"></script>
  </body>
</html>
